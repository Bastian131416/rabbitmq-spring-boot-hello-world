spring:
  application:
    name: rabbitmq-tutorials
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    template:
      retry:
        enabled: true
        initial-interval: 1s
        max-interval: 30s
        multiplier: 2.0
        max-attempts: 3

server:
  port: 8080